name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash target\release\mayhem-companion.exe -Algorithm SHA256).Hash.ToLower()
          "$h  mayhem-companion.exe" | Out-File -Encoding ascii target\release\mayhem-companion.exe.sha256
          Get-Content target\release\mayhem-companion.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: mayhem-companion
          path: |
            target/release/mayhem-companion.exe
            target/release/mayhem-companion.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sum = Get-Content target\release\mayhem-companion.exe.sha256
          $notes = @"
          Unofficial ARAM: Mayhem companion for Windows. Download ``mayhem-companion.exe``, put it in its own folder and run it. Set League to Borderless or Windowed.

          **SHA-256:** ``$sum``

          The exe isn't code-signed yet, so Windows SmartScreen may warn and Defender's machine-learning scanner may flag it as a false positive. Check the hash above, or build it yourself from the source.

          Mayhem Companion isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games, and all associated properties are trademarks or registered trademarks of Riot Games, Inc.
          "@
          gh release create "${{ github.ref_name }}" target\release\mayhem-companion.exe target\release\mayhem-companion.exe.sha256 --title "Mayhem Companion ${{ github.ref_name }}" --notes $notes
