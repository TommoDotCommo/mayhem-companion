name: release

# Push a version tag to test, build and publish the corresponding release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release version and notes
        shell: pwsh
        run: |
          $package = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq "mayhem-companion" }
          if ("v$($package.version)" -ne "${{ github.ref_name }}") { throw "Tag must match Cargo package version" }
          if (!(Test-Path "docs/releases/${{ github.ref_name }}.md")) { throw "Release notes are missing" }

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "target\release\mayhem-companion.exe"
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$h  mayhem-companion.exe" | Out-File -Encoding ascii "$exe.sha256"
          $notes = Get-Content "docs/releases/${{ github.ref_name }}.md" -Raw
          $notes += "`n`n**SHA-256:** ``$h```n"
          $notes | Set-Content -Encoding utf8 "target/release-notes.md"
          gh release create "${{ github.ref_name }}" $exe "$exe.sha256" --verify-tag --draft --title "Mayhem Companion ${{ github.ref_name }}" --notes-file "target/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets" }
          gh release edit "${{ github.ref_name }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release" }
