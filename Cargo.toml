[package]
name = "aram-mayhem"
version = "0.2.0"
edition = "2021"
description = "ARAM Mayhem companion: live augment tiers on the pick cards, champ select helper, build browser"

[[bin]]
name = "aram-mayhem"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
ureq = { version = "2.10", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "__rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
strsim = "0.11"
base64 = "0.22"
log = "0.4"

[build-dependencies]
embed-resource = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Console", "Win32_Security",
  "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections",
  "Security_Cryptography", "Foundation_Numerics", "Win32_UI_Shell", "Win32_System_Registry",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 2
